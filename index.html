<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinematografia para Web Criativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #0f1115;
  --surface: #151920;
  --surface-2: #1d222b;
  --line: #2c323d;
  --fg: #ece7dd;
  --muted: #9ba2ae;
  --tungsten: #f0a640;
  --tungsten-soft: rgba(240, 166, 64, 0.14);
  --daylight: #86b8ff;
  --daylight-soft: rgba(134, 184, 255, 0.14);
  --ok: #77c993;
  --bad: #f07a66;
  --on-accent: #1a1206;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar-h: 46px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--daylight); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
[hidden] { display: none !important; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  min-height: 100%;
}

.content {
  min-width: 0;
  padding-inline: clamp(16px, 3.2vw, 48px);
  padding-block: 0 120px;
}
.content-inner { max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 56px; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  padding-block: 14px 12px;
  background: linear-gradient(var(--bg) 78%, rgba(15, 17, 21, 0));
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 600 12px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--fg); font-weight: 500; }
.overall { display: flex; align-items: center; gap: 10px; font: 500 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.module-nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.module-nav::-webkit-scrollbar { display: none; }
.mod-btn {
  flex: 1 0 96px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 9px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 96px;
}
.mod-btn .num { font: 800 15px/1 var(--display); letter-spacing: 0.04em; color: var(--muted); }
.mod-btn .t { font-size: 11.5px; line-height: 1.25; color: var(--muted); }
.mod-btn .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.mod-btn .bar i { display: block; height: 100%; width: 0; background: var(--tungsten); }
.mod-btn[aria-current="true"] { border-color: var(--tungsten); background: var(--surface-2); }
.mod-btn[aria-current="true"] .num, .mod-btn[aria-current="true"] .t { color: var(--fg); }
.mod-btn.locked .num::after { content: " · em breve"; font: 500 9px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; vertical-align: middle; }

.trophy-btn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
  cursor: pointer;
  font: 500 12px/1.2 var(--mono);
  color: var(--fg);
}
.shelf {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
}
.badge { display: flex; gap: 10px; align-items: center; padding: 6px; }
.badge .ico { font-size: 22px; width: 32px; text-align: center; }
.badge .name { font-weight: 600; font-size: 13px; line-height: 1.25; }
.badge .desc { font-size: 12px; color: var(--muted); line-height: 1.35; }
.badge.locked { opacity: 0.42; }
.badge.locked .ico { filter: grayscale(1); }

.slate { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.slate-stripes { height: 16px; background: repeating-linear-gradient(-45deg, var(--fg) 0 12px, var(--bg) 12px 24px); opacity: 0.85; }
.slate-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  font: 500 11px/1.2 var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.slate-grid > div { padding: 8px 10px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slate-grid > div:first-child { border-left: 0; }
.slate-grid span { color: var(--muted); }
.slate-grid b { font: 800 20px/1 var(--display); letter-spacing: 0.03em; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hero-title { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
.hero-title h1 { font: 800 clamp(44px, 5.4vw, 72px)/0.92 var(--display); text-transform: uppercase; letter-spacing: 0.005em; }
.hero-title h1 em { font-style: normal; color: var(--tungsten); }
.lede { font-size: 17px; line-height: 1.55; color: var(--fg); max-width: 60ch; }
.lede-muted { color: var(--muted); font-size: 14px; max-width: 62ch; }

.section { display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--tungsten); }
.section h2 { font: 800 34px/1 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
.section > p { max-width: 64ch; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 6px 12px;
  font: 500 13px/1.2 var(--mono);
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--daylight-soft); border-color: var(--daylight); }
.chip[aria-pressed="true"]::before { content: "✓ "; color: var(--daylight); }
.chip.static { cursor: default; }

.term-list { display: flex; flex-direction: column; }
.term { border-top: 1px solid var(--line); padding-block: 22px; display: flex; flex-direction: column; gap: 12px; }
.term:last-child { border-bottom: 1px solid var(--line); }
.term-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.term-head h3 { font: 800 28px/1 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
.aka { font: 400 12px/1.2 var(--mono); color: var(--muted); }
.term-status { margin-left: auto; font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ok); }
.term-status.known { color: var(--daylight); }
.analogy { font-size: 17px; line-height: 1.5; max-width: 60ch; }
.analogy::before { content: "Analogia  "; font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--tungsten); vertical-align: 2px; }
.definition { color: var(--muted); max-width: 60ch; }
.definition b { color: var(--fg); font-weight: 600; }
.demo-row { display: flex; flex-wrap: wrap; gap: 6px; }
.term-body { display: flex; flex-direction: column; gap: 12px; }
.term.is-known:not(.expanded) .term-body > :not(.definition):not(.reopen) { display: none; }
.reopen { display: none; }
.term.is-known .reopen { display: inline-flex; }
.term.is-known.expanded .reopen { display: none; }

.more summary { cursor: pointer; font: 500 12px var(--mono); color: var(--muted); letter-spacing: 0.04em; width: fit-content; }
.more summary:hover { color: var(--fg); }
.more dl { margin: 10px 0 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.more dt { font: 500 11px/1.9 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.more dd { margin: 0; }
.more code, .inline-code { font: 13px var(--mono); color: var(--daylight); }

.alt { background: var(--daylight-soft); border-radius: 4px; padding: 10px 12px; max-width: 62ch; }
.alt::before { content: "Outro jeito  "; font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--daylight); }

.btn {
  font: 500 12.5px/1.2 var(--mono);
  border: 1px solid var(--line);
  background: var(--surface-2);
  padding: 8px 11px;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--tungsten); }
.btn.primary { background: var(--tungsten); color: var(--on-accent); border-color: var(--tungsten); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[aria-pressed="true"] { border-color: var(--tungsten); background: var(--tungsten-soft); }
.link-btn { background: none; border: 0; padding: 0; cursor: pointer; font: 500 12.5px var(--mono); color: var(--daylight); text-decoration: underline; text-underline-offset: 3px; width: fit-content; }

.critical { display: flex; flex-direction: column; gap: 14px; }
.split-table { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.split-table > div { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.split-table h4 { margin: 0; font: 500 12px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.split-table .pos h4 { color: var(--tungsten); }
.split-table .rot h4 { color: var(--daylight); }
.split-table p { font-size: 14px; color: var(--muted); }
.diagram { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.diagram text { font-family: var(--mono); font-size: 11px; fill: var(--muted); letter-spacing: 0.04em; }
.diagram .lbl { fill: var(--fg); font-size: 12px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table.cheat { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13.5px; }
.cheat th, .cheat td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.cheat th { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
.cheat td:first-child { font-weight: 600; white-space: nowrap; }
.cheat td:last-child { font: 12.5px/1.5 var(--mono); color: var(--daylight); }
.cheat tr:last-child td { border-bottom: 0; }

.quiz { display: flex; flex-direction: column; gap: 18px; }
.q { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.q legend { font-weight: 600; padding: 0; margin-bottom: 8px; max-width: 62ch; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 9px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.opt:hover:not(:disabled) { border-color: var(--fg); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: rgba(119, 201, 147, 0.12); }
.opt.wrong { border-color: var(--bad); background: rgba(240, 122, 102, 0.12); }
.q-feedback { font-size: 14px; color: var(--muted); max-width: 62ch; }
.q-feedback.right b { color: var(--ok); }
.q-feedback.wrong b { color: var(--bad); }
.quiz-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font: 500 13px var(--mono); }

.criteria { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.criteria li { display: flex; gap: 10px; align-items: baseline; }
.criteria li::before { content: "○"; color: var(--muted); font-family: var(--mono); }
.criteria li.done::before { content: "●"; color: var(--ok); }

.award { display: flex; gap: 18px; align-items: center; border: 1px dashed var(--line); border-radius: 6px; padding: 18px; }
.award .ico { font-size: 44px; line-height: 1; }
.award.unlocked { border-style: solid; border-color: var(--tungsten); background: var(--tungsten-soft); }
.award:not(.unlocked) .ico { filter: grayscale(1); opacity: 0.45; }
.award h3 { font: 800 26px/1 var(--display); text-transform: uppercase; }
.award p { color: var(--muted); font-size: 14px; }

.sandbox {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--line);
  background: var(--surface);
  min-width: 0;
}
.sandbox-bar {
  height: var(--bar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-inline: 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.sandbox-bar .title { font: 500 11px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sandbox-bar .title b { color: var(--fg); font-weight: 500; }
.tools { display: flex; gap: 6px; flex-shrink: 0; }
.tools .btn { padding: 6px 9px; font-size: 11.5px; }

.stage { position: relative; flex: 1 1 auto; min-height: 240px; overflow: hidden; background: var(--bg); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.frame { position: absolute; pointer-events: none; }
.frame.monitor { border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); }
.frame.monitor.cam-a { border-color: rgba(240, 166, 64, 0.6); }
.frame.monitor.cam-b { border-color: rgba(134, 184, 255, 0.6); }
.frame.fullscreen { border-color: transparent; box-shadow: none; }
.frame-label {
  position: absolute;
  left: 8px;
  top: 7px;
  font: 500 10.5px/1 var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: rgba(15, 17, 21, 0.78);
  color: var(--fg);
  padding: 4px 6px;
  border-radius: 3px;
  white-space: nowrap;
}
.frame-label .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.cam-a .dot { background: var(--tungsten); }
.cam-b .dot { background: var(--daylight); }
.corners {
  position: absolute;
  inset: 10px;
  opacity: 0.5;
  --c: var(--fg);
  background:
    linear-gradient(var(--c), var(--c)) left top / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) left top / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) right top / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) right top / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) left bottom / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) left bottom / 1px 14px no-repeat,
    linear-gradient(var(--c), var(--c)) right bottom / 14px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) right bottom / 1px 14px no-repeat;
}
.frame-set .corners { display: none; }
.frame-hud {
  position: absolute;
  left: 8px;
  bottom: 7px;
  font: 500 10.5px/1.3 var(--mono);
  background: rgba(15, 17, 21, 0.78);
  padding: 4px 6px;
  border-radius: 3px;
  font-variant-numeric: tabular-nums;
}
.changed-chip {
  position: absolute;
  top: 10px;
  right: 10px;
  max-width: calc(100% - 20px);
  font: 500 11px/1.3 var(--mono);
  background: rgba(15, 17, 21, 0.82);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 8px;
  color: var(--muted);
  pointer-events: none;
}
.changed-chip b { color: var(--tungsten); font-weight: 500; }
.toast {
  position: absolute;
  left: 50%;
  top: 46px;
  transform: translateX(-50%);
  max-width: min(90%, 420px);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 13px;
  text-align: center;
  pointer-events: none;
}

.codepanel { border-top: 1px solid var(--line); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; max-height: 34vh; overflow: auto; }
.codepanel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.codepanel-head b { color: var(--fg); font-weight: 500; }
.codepanel pre { margin: 0; font: 12.5px/1.6 var(--mono); white-space: pre; overflow-x: auto; color: var(--fg); }
.tk-com { color: #7d8594; font-style: italic; }
.tk-str { color: #a8d59a; }
.tk-num { color: var(--tungsten); }
.tk-kw { color: #c9a6ff; }
.tk-prop { color: var(--daylight); }
.readout { display: grid; grid-template-columns: max-content repeat(3, minmax(0, 1fr)); gap: 2px 10px; font: 12px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
.readout .prop { color: var(--muted); }
.readout .val { color: var(--fg); transition: color 0.2s; }
.readout .val.changed { color: var(--tungsten); }
.readout .val.changed::after { content: " Δ"; font-size: 10px; }
.readout .cam-tag { grid-column: 1 / -1; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
.readout .cam-tag.a { color: var(--tungsten); }
.readout .cam-tag.b { color: var(--daylight); }

.controls { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.tabs { display: flex; gap: 4px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 6px; cursor: pointer; font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--tungsten); }
.moves-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 5px; }
.moves-grid .btn { padding: 7px 8px; font-size: 11.5px; text-align: center; }
.moves-grid .btn.wide { grid-column: span 2; background: var(--daylight-soft); border-color: rgba(134, 184, 255, 0.45); }
.challenge-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.8fr); gap: 10px 14px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font: 500 11px var(--mono); letter-spacing: 0.04em; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.field output { color: var(--tungsten); font-variant-numeric: tabular-nums; }
.field input[type="range"] { width: 100%; accent-color: var(--tungsten); }
.field select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 12px var(--mono); }
.challenge-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ch-result { font-size: 13.5px; line-height: 1.45; }
.ch-result.ok { color: var(--ok); }
.ch-result.bad { color: var(--bad); }
.panel-note { font-size: 13px; color: var(--muted); }

.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(5, 6, 8, 0.72); display: grid; place-items: center; padding: 16px; }
.modal {
  width: min(420px, 100%);
  background: var(--surface);
  border: 1px solid var(--tungsten);
  border-radius: 8px;
  overflow: hidden;
  text-align: center;
}
.modal .slate-stripes { height: 14px; }
.modal-body { padding: 26px 24px 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.modal .ico { font-size: 64px; line-height: 1; }
.modal .kicker { font: 500 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--tungsten); }
.modal h2 { font: 800 34px/1 var(--display); text-transform: uppercase; }
.modal p { color: var(--muted); font-size: 14px; }
.pop { animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.placeholder-terms { display: flex; flex-wrap: wrap; gap: 6px; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sandbox { display: contents; }
  .sandbox-bar { order: -4; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; padding-inline: 16px; }
  .stage { order: -3; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); z-index: 8; flex: none; height: min(40svh, 60vw); min-height: 200px; border-bottom: 1px solid var(--line); }
  .sandbox-bar, .stage, .controls, .codepanel { min-width: 0; }
  .controls { order: -2; padding-inline: 16px; }
  .codepanel { order: -1; max-height: none; padding-inline: 16px; }
  .content { order: 0; }
  .topbar { position: static; background: none; }

function buildCameraBody(color) {
  const group = new THREE.Group();
  const shell = new THREE.MeshStandardMaterial({ color: 0x2a2f38, roughness: 0.5 });
  const accent = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 0.52), shell);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.22, 20), accent);
  lens.rotation.x = Math.PI / 2;
  lens.position.z = -0.37;
  const reelGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.05, 24);
  [0.13, -0.13].forEach(z => {
    const reel = new THREE.Mesh(reelGeo, accent);
    reel.rotation.z = Math.PI / 2;
    reel.position.set(0, 0.3, z);
    group.add(reel);
  });
  group.add(box, lens);
  group.traverse(o => o.layers.set(1));
  return group;
}

function createShot(name, color) {
  const cam = new THREE.PerspectiveCamera(fovFromFocal(FOCAL_MM), MONITOR_ASPECT, 0.1, 140);
  cam.rotation.order = 'YXZ';
  const frustumProxy = new THREE.PerspectiveCamera(cam.fov, MONITOR_ASPECT, 0.3, 3.2);
  const frustum = new THREE.CameraHelper(frustumProxy);
  const tint = new THREE.Color(color);
  frustum.setColors(tint, tint, tint, tint, tint);
  frustum.layers.set(1);
  const body = buildCameraBody(color);
  const sight = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.45 }),
  );
  sight.frustumCulled = false;
  sight.layers.set(1);
  const targetMarker = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), new THREE.MeshBasicMaterial({ color }));
  targetMarker.layers.set(1);
  scene.add(frustum, body, sight, targetMarker);
  return {
    name, cam, frustumProxy, frustum, body, sight, targetMarker,
    rig: { pos: HOME.pos.clone(), target: HOME.target.clone() },
    active: null,
  };
}

function syncShot(shot) {
  const { cam, rig, frustumProxy } = shot;
  cam.position.copy(rig.pos);
  cam.lookAt(rig.target);
  cam.updateMatrixWorld();
  frustumProxy.position.copy(cam.position);
  frustumProxy.quaternion.copy(cam.quaternion);
  frustumProxy.fov = cam.fov;
  frustumProxy.updateProjectionMatrix();
  frustumProxy.updateMatrixWorld();
  shot.frustum.update();
  shot.body.position.copy(cam.position);
  shot.body.quaternion.copy(cam.quaternion);
  const line = shot.sight.geometry.attributes.position;
  line.setXYZ(0, rig.pos.x, rig.pos.y, rig.pos.z);
  line.setXYZ(1, rig.target.x, rig.target.y, rig.target.z);
  line.needsUpdate = true;
  shot.targetMarker.position.copy(rig.target);
}

function dolly(shot, direction, seconds) {
  const dir = viewDir(shot);
  const distance = dir.length();
  dir.normalize();
  const step = direction > 0 ? Math.min(3, distance - 2) : Math.min(3, 24 - distance);
  if (step <= 0.05) {
    notify(direction > 0 ? 'Mais perto que isso o herói chama a segurança. Tenta um pull-out.' : 'Já tá longe demais. Daqui só de drone.');
    return null;
  }
  const end = shot.rig.pos.clone().addScaledVector(dir, step * direction);
  return gsap.to(shot.rig.pos, { x: end.x, y: end.y, z: end.z, duration: seconds, ease: MOVE_EASE });
}

function truck(shot, direction, seconds, distance = 2.5) {
  const offset = rightOf(shot).multiplyScalar(distance * direction);
  return gsap.to([shot.rig.pos, shot.rig.target], { x: `+=${offset.x}`, z: `+=${offset.z}`, duration: seconds, ease: MOVE_EASE });
}

function pedestal(shot, direction, seconds) {
  const amount = direction > 0 ? Math.min(1.5, 6 - shot.rig.pos.y) : -Math.min(1.5, shot.rig.pos.y - 0.4);
  if (Math.abs(amount) < 0.05) {
    notify(direction > 0 ? 'O pedestal chegou no talo. Pra subir mais, só de crane.' : 'Mais baixo que isso a câmera vira tapete.');
    return null;
  }
  return gsap.to([shot.rig.pos, shot.rig.target], { y: `+=${amount}`, duration: seconds, ease: MOVE_EASE });
}

function rotateTargetAroundCamera(shot, axis, angle, seconds) {
  const base = viewDir(shot);
  const turn = { angle: 0 };
  return gsap.to(turn, {
    angle,
    duration: seconds,
    ease: MOVE_EASE,
    onUpdate: () => shot.rig.target.copy(shot.rig.pos).add(base.clone().applyAxisAngle(axis, turn.angle)),
  });
}

const pan = (shot, direction, seconds, angle = 0.34) => rotateTargetAroundCamera(shot, UP, -direction * angle, seconds);

function tilt(shot, direction, seconds) {
  const pitch = Math.asin(viewDir(shot).normalize().y);
  const limit = 1.2;
  const angle = THREE.MathUtils.clamp(pitch + direction * 0.3, -limit, limit) - pitch;
  return rotateTargetAroundCamera(shot, rightOf(shot), angle, seconds);
}

function orbitAround(shot, direction, seconds) {
  const offset = shot.rig.pos.clone().sub(shot.rig.target);
  const sweep = { angle: 0 };
  return gsap.to(sweep, {
    angle: direction * Math.PI / 2,
    duration: seconds * 1.3,
    ease: MOVE_EASE,
    onUpdate: () => shot.rig.pos.copy(shot.rig.target).add(offset.clone().applyAxisAngle(UP, sweep.angle)),
  });
}

function crane(shot, direction, seconds) {
  const { pos } = shot.rig;
  const away = horizontal(viewDir(shot)).normalize().multiplyScalar(-1);
  const horizontalDistance = horizontal(viewDir(shot)).length();
  const rise = direction > 0 ? Math.min(3.2, 8 - pos.y) : -Math.min(3.2, pos.y - 0.6);
  const reach = direction > 0 ? 2 : -Math.min(2, horizontalDistance - 2.2);
  if (Math.abs(rise) < 0.05) {
    notify(direction > 0 ? 'A grua não estica mais. O sindicato dos braços mecânicos agradece.' : 'Crane no chão já. Daqui pra baixo é escavação.');
    return null;
  }
  return gsap.timeline()
    .to(pos, { y: pos.y + rise, duration: seconds, ease: MOVE_EASE })
    .to(pos, { x: pos.x + away.x * reach, z: pos.z + away.z * reach, duration: seconds, ease: direction > 0 ? 'sine.out' : 'sine.in' }, '<');
}

function tracking(shot, seconds) {
  const step = hero.position.x > 1.5 ? -4 : 4;
  const turnTime = seconds * 0.12;
  return gsap.timeline()
    .to(hero.rotation, { y: Math.sign(step) * Math.PI / 2, duration: turnTime, ease: 'power1.out' })
    .to(hero.position, { x: `+=${step}`, duration: seconds, ease: 'none' })
    .to([shot.rig.pos, shot.rig.target], { x: `+=${step}`, duration: seconds, ease: 'none' }, '<')
    .to(hero.rotation, { y: 0, duration: turnTime, ease: 'power1.inOut' });
}

};

const escapeHtml = text => text.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function highlightCode(code) {
  return code.split('\n').map(line => {
    const commentStart = line.indexOf('//');
    const source = commentStart >= 0 ? line.slice(0, commentStart) : line;
    const comment = commentStart >= 0 ? line.slice(commentStart) : '';
    const tokens = escapeHtml(source).replace(
      /(&quot;.*?&quot;)|\b(\d+(?:\.\d+)?)\b|\b(const|let|new|Math)\b|\b(position|rotation|fov|lookAt|order)\b/g,
      (match, str, num, kw, prop) => {
        if (str) return `<span class="tk-str">${str}</span>`;
        if (num) return `<span class="tk-num">${num}</span>`;
        if (kw) return `<span class="tk-kw">${kw}</span>`;
        return `<span class="tk-prop">${prop}</span>`;
      },
    );
    return tokens + (comment ? `<span class="tk-com">${escapeHtml(comment)}</span>` : '');
  }).join('\n');
}

function showCode(entry) {
  if (!entry) {
    $('code-title').textContent = 'escolha um movimento';
    $('code-body').innerHTML = `<span class="tk-com">${escapeHtml('// aperte um botão de movimento e o código aparece aqui')}</span>`;
    return;
  }
  $('code-title').textContent = entry.label;
  const noteLines = entry.notes.map(note => `// ${note}`).join('\n');
  $('code-body').innerHTML = highlightCode(`${noteLines}\n${entry.code}`);
}

const READOUT_KEYS = ['px', 'py', 'pz', 'rx', 'ry', 'rz', 'fov'];
const READOUT_NAMES = { px: 'position.x', py: 'position.y', pz: 'position.z', rx: 'rotation.x', ry: 'rotation.y', rz: 'rotation.z', fov: 'fov' };

function readCamera(cam) {
  return { px: cam.position.x, py: cam.position.y, pz: cam.position.z, rx: cam.rotation.x, ry: cam.rotation.y, rz: cam.rotation.z, fov: cam.fov };
}

const visibleShots = () => (state.compare ? [camA, camB] : [camA]);

function buildReadout() {
  const multi = state.compare;
  $('readout').innerHTML = visibleShots().map(shot => {
    const id = shot.name;
    const tag = multi ? `<span class="cam-tag ${id.toLowerCase()}">Cam ${id}</span>` : '';
    return `${tag}
      <span class="prop">camera.position</span><span class="val" data-k="${id}-px"></span><span class="val" data-k="${id}-py"></span><span class="val" data-k="${id}-pz"></span>
      <span class="prop">camera.rotation</span><span class="val" data-k="${id}-rx"></span><span class="val" data-k="${id}-ry"></span><span class="val" data-k="${id}-rz"></span>
      <span class="prop">camera.fov</span><span class="val" data-k="${id}-fov"></span><span></span><span></span>`;
  }).join('');
}

function snapshotBaseline() {
  visibleShots().forEach(syncShot);
  state.baseline = Object.fromEntries(visibleShots().map(shot => [shot.name, readCamera(shot.cam)]));
}

let lastChangedText = '';
function updateReadout() {
  const changed = new Set();
  for (const shot of visibleShots()) {
    const now = readCamera(shot.cam);
    const base = state.baseline?.[shot.name];
    for (const key of READOUT_KEYS) {
      const cell = $('readout').querySelector(`[data-k="${shot.name}-${key}"]`);
      if (!cell) continue;
      const text = key === 'fov' ? `${now.fov.toFixed(1)}° (${FOCAL_MM}mm)` : now[key].toFixed(2);
      if (cell.textContent !== text) cell.textContent = text;
      const isChanged = base && Math.abs(now[key] - base[key]) > 0.01;
      cell.classList.toggle('changed', Boolean(isChanged));
      if (isChanged) changed.add(READOUT_NAMES[key]);
    }
  }
  const text = changed.size ? [...changed].join(' · ') : (state.baseline ? 'nada (ainda)' : 'nada ainda');
  if (text !== lastChangedText) {
    $('changed-chip').innerHTML = `mudou → <b>${text}</b>`;
    lastChangedText = text;
  }
}

let toastTimer = 0;
function notify(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
}

function killShotMotion(shot) {
  shot.active?.kill();
  shot.active = null;
}

function runMove(key) {
  const move = MOVES[key];
  if (state.compare) setCompare(false);
  if (state.challengeActive) exitChallenge();
  killShotMotion(camA);
  snapshotBaseline();
  const tween = move.run(camA, dur(2.2));
  showCode(move);
  if (!tween) return;
  camA.active = tween;
  state.tags.A = move.label;
  refreshFrameLabels();
  progress.takes += 1;
  markSeen(move.term);
}

function runPanTruckComparison() {
  if (state.challengeActive) exitChallenge();
  setCompare(true);
  [camA, camB].forEach(shot => {
    killShotMotion(shot);
    shot.rig.pos.copy(HOME.pos);
    shot.rig.target.copy(HOME.target);
  });
  hero.position.set(0, 0, 0);
  hero.rotation.set(0, 0, 0);
  snapshotBaseline();
  const lateral = 2.5;
  const matchingAngle = Math.atan2(lateral, HOME.pos.z - HOME.target.z);
  camA.active = gsap.to({}, { duration: dur(0.6), onComplete: () => { camA.active = pan(camA, 1, dur(2.6), matchingAngle); } });
  camB.active = gsap.to({}, { duration: dur(0.6), onComplete: () => { camB.active = truck(camB, 1, dur(2.6), lateral); } });
  state.tags.A = 'pan →';
  state.tags.B = 'truck →';
  refreshFrameLabels();
  showCode(COMPARE_PAN_TRUCK);
  progress.takes += 1;
  progress.m1.compared = true;
  markSeen('pan', false);
  markSeen('truck');
}

function setCompare(on) {
  state.compare = on;
  setShotVisible(camB, on);
  if (!on) state.tags.B = '';
  buildReadout();
  relayout();
}

function setSetView(on) {
  state.setView = on;
  orbit.enabled = on;
  $('btn-setview').setAttribute('aria-pressed', String(on));
  relayout();
}

function setMotion(on) {
  state.motion = on;
  storage.write(MOTION_KEY, on);
  $('btn-motion').setAttribute('aria-pressed', String(on));
  $('btn-motion').textContent = on ? 'Animar' : 'Instantâneo';
  $('btn-motion').title = on ? 'Animações ligadas. Clique para resultado instantâneo.' : 'Modo instantâneo (prefers-reduced-motion). Clique para animar.';
}

function resetScene({ countAsReset = true } = {}) {
  [camA, camB].forEach(shot => {
    killShotMotion(shot);
    shot.rig.pos.copy(HOME.pos);
    shot.rig.target.copy(HOME.target);
  });
  gsap.killTweensOf([hero.position, hero.rotation]);
  hero.position.set(0, 0, 0);
  hero.rotation.set(0, 0, 0);
  setCam.position.copy(SET_CAM_HOME.pos);
  orbit.target.copy(SET_CAM_HOME.target);
  orbit.update();
  state.tags = { A: '', B: '' };
  if (state.compare) setCompare(false);
  if (state.challengeActive) exitChallenge();
  state.baseline = null;
  showCode(null);
  refreshFrameLabels();
  if (countAsReset) {
    progress.resets += 1;
    saveProgress();
    checkAchievements();
  }
}

const stage = $('stage');
const frames = { set: $('frame-set'), A: $('frame-a'), B: $('frame-b') };
let stageSize = { w: 1, h: 1 };
let views = [];

function fitAspect(x, y, w, h, aspect) {
  let width = w;
  let height = w / aspect;
  if (height > h) {
    height = h;
    width = h * aspect;
  }
  return { x: x + (w - width) / 2, y: y + (h - height) / 2, w: width, h: height };
}

function computeViews(w, h) {
  const shots = visibleShots();
  if (state.setView) {
    const margin = 10;
    const insetW = Math.min(w * (state.compare ? 0.42 : 0.4), state.compare ? 300 : 360);
    const insetH = insetW / MONITOR_ASPECT;
    return [
      { kind: 'set', cam: setCam, rect: { x: 0, y: 0, w, h } },
      ...shots.map((shot, i) => ({
        kind: 'shot', shot,
        rect: { x: state.compare && i === 0 ? margin : w - insetW - margin, y: h - insetH - margin, w: insetW, h: insetH },
      })),
    ];
  }
  if (state.compare) {
    const gap = 6;
    const half = (w - gap) / 2;
    return [
      { kind: 'shot', shot: camA, rect: fitAspect(0, 0, half, h, MONITOR_ASPECT) },
      { kind: 'shot', shot: camB, rect: fitAspect(half + gap, 0, half, h, MONITOR_ASPECT) },
    ];
  }
  return [{ kind: 'shot', shot: camA, rect: fitAspect(0, 0, w, h, MONITOR_ASPECT) }];
}

function placeFrame(el, rect) {
  el.hidden = false;
  Object.assign(el.style, { left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.w}px`, height: `${rect.h}px` });
}

function relayout() {
  const { w, h } = stageSize;
  views = computeViews(w, h);
  setCam.aspect = w / h;
  setCam.updateProjectionMatrix();
  Object.values(frames).forEach(el => { el.hidden = true; });
  for (const view of views) {
    if (view.kind === 'set') {
      placeFrame(frames.set, view.rect);
      continue;
    }
    const el = frames[view.shot.name];
    placeFrame(el, view.rect);
    el.classList.toggle('fullscreen', !state.setView && !state.compare);
  }
  refreshFrameLabels();
}

function refreshFrameLabels() {
  ['A', 'B'].forEach(name => {
    const tag = state.tags[name] ? ` · ${state.tags[name]}` : '';
    frames[name].querySelector('.txt').textContent = `Cam ${name} · ${FOCAL_MM}mm${tag}`;
  });
  const mode = state.setView ? 'Visão de set' : 'Monitor';
  $('sandbox-title').innerHTML = `Sandbox · <b>${mode}</b> · Cam A ${FOCAL_MM}mm`;
}

new ResizeObserver(() => {
  const rect = stage.getBoundingClientRect();
  stageSize = { w: Math.max(1, Math.round(rect.width)), h: Math.max(1, Math.round(rect.height)) };
  renderer.setSize(stageSize.w, stageSize.h, false);
  relayout();
}).observe(stage);

function measureHeroFraming(shot) {
  syncShot(shot);
  const top = hero.position.clone().setY(HERO_TOP).project(shot.cam);
  const feet = hero.position.clone().setY(0).project(shot.cam);
  return {
    share: (top.y - feet.y) / 2,
    headInFrame: top.y <= 0.98 && Math.abs(top.x) <= 1,
    centered: Math.abs(top.x) < 0.4,
  };
}

function updateChallengeHud() {
  const hud = frames.A.querySelector('.frame-hud');
  if (!state.challengeActive) {
    hud.hidden = true;
    return;
  }
  const framing = measureHeroFraming(camA);
  hud.hidden = false;
  const headNote = framing.headInFrame ? 'cabeça ok' : 'cabeça cortada';
  hud.textContent = `herói: ${Math.round(framing.share * 100)}% da altura · ${headNote}`;
}

const clock = new THREE.Clock();
let lastHeroX = 0;
renderer.setAnimationLoop(() => {
  const elapsed = clock.getElapsedTime();
  const heroSpeed = Math.abs(hero.position.x - lastHeroX);
  lastHeroX = hero.position.x;
  heroModel.position.y = heroSpeed > 0.0005 ? Math.abs(Math.sin(elapsed * 11)) * 0.06 : 0;

  visibleShots().forEach(syncShot);
  if (state.setView) orbit.update();

  const { w, h } = stageSize;
  renderer.setViewport(0, 0, w, h);
  renderer.setScissor(0, 0, w, h);
  renderer.setClearColor(COLOR.letterbox);
  renderer.clear();
  for (const view of views) {
    const { x, y, w: vw, h: vh } = view.rect;
    const glY = h - y - vh;
    renderer.setViewport(x, glY, vw, vh);
    renderer.setScissor(x, glY, vw, vh);
    renderer.render(scene, view.kind === 'set' ? setCam : view.shot.cam);
  }
  updateReadout();
  updateChallengeHud();
});

function enterChallenge() {
  if (state.compare) setCompare(false);
  killShotMotion(camA);
  gsap.killTweensOf([hero.position, hero.rotation]);
  hero.position.set(0, 0, 0);
  hero.rotation.set(0, 0, 0);
  state.challengeActive = true;
  state.panelTab = 'challenge';
  state.tags.A = 'desafio';
  camA.rig.target.copy(HOME.target);
  camA.active = gsap.to(camA.rig.pos, { x: 0, y: HOME.pos.y, z: CHALLENGE_START_Z, duration: dur(0.6), ease: 'power1.inOut' });
  state.baseline = null;
  renderControls();
  refreshFrameLabels();
  showChallengeCode();
}

function exitChallenge() {
  state.challengeActive = false;
  state.tags.A = '';
  if (state.panelTab === 'challenge') {
    state.panelTab = 'moves';
    renderControls();
  }
}

function readChallengeInputs() {
  return {
    distance: Number($('ch-dist').value),
    duration: Number($('ch-dur').value),
    ease: $('ch-ease').value,
  };
}

function showChallengeCode() {
  if (!$('ch-dist')) return;
  const { distance, duration, ease } = readChallengeInputs();
  showCode({
    label: 'Desafio · push-in',
    notes: ['sua versão. mexa nos controles e o código acompanha.'],
    code: `camera.position.set(0, 1.6, ${CHALLENGE_START_Z})\ngsap.to(camera.position, { z: ${distance.toFixed(1)}, duration: ${duration}, ease: "${ease}" })\ncamera.lookAt(target)`,
  });
}

function runChallenge() {
  const { distance, duration, ease } = readChallengeInputs();
  killShotMotion(camA);
  camA.rig.pos.set(0, HOME.pos.y, CHALLENGE_START_Z);
  camA.rig.target.copy(HOME.target);
  snapshotBaseline();
  showChallengeCode();
  $('ch-result').className = 'ch-result';
  $('ch-result').textContent = state.motion ? 'Rodando... 🎬' : 'Modo instantâneo: avaliando pela duração que você escolheu.';
  progress.takes += 1;
  camA.active = gsap.to(camA.rig.pos, {
    z: distance,
    duration: dur(duration),
    ease,
    onComplete: () => judgeChallenge(duration, ease),
  });
}

function judgeChallenge(duration, ease) {
  const framing = measureHeroFraming(camA);
  const percent = Math.round(framing.share * 100);
  const problems = [];
  if (duration < 3) problems.push(`Rápido demais: ${duration}s é push-in de quem tomou três cafés. Lento aqui é 3s ou mais.`);
  if (!framing.headInFrame) problems.push('Perto demais: a cabeça do herói saiu do quadro. Ficou sem testa, coitado.');
  else if (framing.share < 0.5) problems.push(`Ainda longe: o herói ocupa ${percent}% da altura do quadro. Precisa de pelo menos 50%.`);
  const result = $('ch-result');
  if (problems.length) {
    result.className = 'ch-result bad';
    result.textContent = `Corta! ${problems.join(' ')}`;
    return;
  }
  const easeNote = ease === 'none'
    ? ' Dica de bônus: com ease "none" ele começa e para de supetão. No Módulo 5 a gente resolve isso.'
    : '';
  result.className = 'ch-result ok';
  result.textContent = `Valeu, é take! Push-in de ${duration}s, herói em ${percent}% do quadro.${easeNote}`;
  if (!progress.m1.challenge) {
    progress.m1.challenge = true;
    saveProgress();
    renderProgressBits();
    checkAchievements();
  }
}

function markSeen(termId, rerender = true) {
  if (!progress.m1.seen.includes(termId)) progress.m1.seen.push(termId);
  saveProgress();
  if (rerender) {
    refreshTermStatuses();
    renderProgressBits();
    checkAchievements();
  }
}

function quizStatus() {
  const answered = QUIZ_M1.filter(q => progress.m1.quiz[q.id] !== undefined);
  const correct = answered.filter(q => progress.m1.quiz[q.id] === q.answer).length;
  return { answered: answered.length, correct, passed: answered.length === QUIZ_M1.length && correct >= 2 };
}

function moduleOneStatus() {
  const m = progress.m1;
  const covered = TERMS_M1.filter(t => m.known.includes(t.id) || m.seen.includes(t.id)).length;
  const quiz = quizStatus();
  const done = covered + Number(m.compared) + Number(quiz.passed) + Number(m.challenge);
  const total = TERMS_M1.length + 3;
  return { covered, quiz, percent: Math.round((done / total) * 100), complete: done === total };
}

function checkAchievements() {
  if (moduleOneStatus().complete) unlock('m1');
  if (progress.resets >= 10) unlock('stagehand');
}

function unlock(id) {
  if (progress.achievements.includes(id)) return;
  progress.achievements.push(id);
  saveProgress();
  const achievement = ACHIEVEMENTS.find(a => a.id === id);
  renderShelf();
  renderProgressBits();

}

function quizMarkup() {
  const status = quizStatus();
  const questions = QUIZ_M1.map((q, qi) => {
    const chosen = progress.m1.quiz[q.id];
    const answered = chosen !== undefined;
    const options = q.options.map((opt, oi) => {
      let cls = '';
      if (answered && oi === q.answer) cls = 'right';
      else if (answered && oi === chosen) cls = 'wrong';
      return `<button class="opt ${cls}" data-quiz="${q.id}" data-opt="${oi}" ${answered ? 'disabled' : ''}>${escapeHtml(opt)}</button>`;
    }).join('');
    const feedback = answered
      ? `<p class="q-feedback ${chosen === q.answer ? 'right' : 'wrong'}"><b>${chosen === q.answer ? 'Isso!' : 'Quase.'}</b> ${q.why[chosen]}${chosen === q.answer ? '' : ` A resposta é <b>${escapeHtml(q.options[q.answer])}</b>: ${q.why[q.answer]}`}</p>`
      : '';
    return `<fieldset class="q"><legend>${qi + 1}. ${escapeHtml(q.text)}</legend><div class="opts">${options}</div>${feedback}</fieldset>`;
  }).join('');
  const foot = status.answered === QUIZ_M1.length
    ? `<div class="quiz-foot"><span>${status.correct}/${QUIZ_M1.length} ${status.passed ? '· passou ✔' : '· precisa de 2'}</span><button class="btn" data-action="quiz-retry">Refazer</button></div>`
    : '';
  return questions + foot;
}

function setModule(id) {
  state.module = id;

  else renderPlaceholderModule(module);
  renderControls();
  window.scrollTo({ top: 0, behavior: state.motion ? 'smooth' : 'auto' });
}

document.addEventListener('click', event => {
  const target = event.target.closest('button');
  if (!target) return;

  if (target.dataset.move) return runMove(target.dataset.move);
  if (target.dataset.module) return setModule(Number(target.dataset.module));
  if (target.dataset.tab) {
    if (target.dataset.tab === 'challenge') return enterChallenge();
    exitChallenge();
    state.panelTab = 'moves';
    return renderControls();
  }
  if (target.dataset.known) {
    const id = target.dataset.known;
    const known = progress.m1.known;
    const index = known.indexOf(id);
    if (index >= 0) known.splice(index, 1);
    else known.push(id);
    target.setAttribute('aria-pressed', String(index < 0));
    saveProgress();
    refreshTermStatuses();
    renderProgressBits();
    checkAchievements();
    return;
  }
  if (target.dataset.quiz) {
    progress.m1.quiz[target.dataset.quiz] = Number(target.dataset.opt);
    saveProgress();
    $('quiz-body').innerHTML = quizMarkup();
    renderProgressBits();
    checkAchievements();
    return;
  }

  switch (target.dataset.action) {
    case 'alt': {
      const alt = $(`alt-${target.dataset.term}`);
      alt.hidden = !alt.hidden;
      break;
    }
    case 'reopen':
      $(`term-${target.dataset.term}`).classList.add('expanded');
      break;
    case 'compare':
      runPanTruckComparison();
      break;
    case 'quiz-retry':
      progress.m1.quiz = {};
      saveProgress();
      $('quiz-body').innerHTML = quizMarkup();
      renderProgressBits();
      break;
    case 'open-challenge':
      enterChallenge();
      break;
    case 'challenge-run':
      runChallenge();
      break;
  }
});

document.addEventListener('input', event => {
  const id = event.target.id;
  if (!id.startsWith('ch-')) return;
  const { distance, duration, ease } = readChallengeInputs();
  Object.assign(challengeDraft, { distance, duration, ease });
  $('ch-dist-out').textContent = `${distance.toFixed(1)} m`;
  $('ch-dur-out').textContent = `${duration} s`;
  showChallengeCode();
});

$('btn-setview').addEventListener('click', () => setSetView(!state.setView));
$('btn-motion').addEventListener('click', () => setMotion(!state.motion));
$('btn-reset').addEventListener('click', () => resetScene());
$('trophy-btn').addEventListener('click', () => {
  const shelf = $('shelf');
  shelf.hidden = !shelf.hidden;
  $('trophy-btn').setAttribute('aria-expanded', String(!shelf.hidden));
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') $('modal-root').innerHTML = '';
});

setMotion(state.motion);
setSetView(true);
buildReadout();
showCode(null);
renderShelf();
setModule(1);
</script>
</body>
</html>
