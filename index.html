<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinematografia para Web Criativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/course.css">
<link rel="stylesheet" href="css/sandbox.css">
<link rel="stylesheet" href="css/modules/module-4.css">
<link rel="stylesheet" href="css/modules/module-5.css">
<link rel="stylesheet" href="css/modules/module-6.css">
</head>
<body>
<div class="app">
  <main class="content">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand"><b>Cinematografia</b> para Web Criativa</div>
        <div class="overall">
          <span id="overall-label">0%</span>
          <button class="trophy-btn" id="trophy-btn" aria-expanded="false" aria-controls="shelf">🏆 <span id="trophy-count">0/7</span></button>
        </div>
      </div>
      <div class="shelf" id="shelf" hidden></div>
      <nav class="module-nav" id="module-nav" aria-label="Módulos"></nav>
    </header>
    <div class="content-inner" id="module-content"></div>
  </main>

  <aside class="sandbox" aria-label="Sandbox 3D">
    <div class="sandbox-bar">
      <div class="title" id="sandbox-title">Sandbox · <b>Cam A 35mm</b></div>
      <div class="tools">
        <button class="btn" id="btn-setview" aria-pressed="true" title="Câmera externa mostrando a câmera da cena">🎥 <span class="lbl-long">Visão de </span>set</button>
        <button class="btn" id="btn-motion" aria-pressed="true" title="Liga ou desliga as animações das demos">Animar</button>
        <button class="btn" id="btn-reset">↺ <span class="lbl-long">Resetar</span></button>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="scene"></canvas>
      <div class="frame frame-set" id="frame-set" hidden><span class="frame-label">Visão de set · arraste para girar</span></div>
      <div class="frame monitor cam-a" id="frame-a" hidden><div class="thirds"></div><div class="fade"></div><div class="corners"></div><span class="frame-label"><span class="dot"></span><span class="txt">Cam A · 35mm</span></span><span class="frame-hud" hidden></span></div>
      <div class="frame monitor cam-b" id="frame-b" hidden><div class="thirds"></div><div class="corners"></div><span class="frame-label"><span class="dot"></span><span class="txt">Cam B · 35mm</span></span></div>
      <div class="frame monitor cam-c" id="frame-c" hidden><div class="thirds"></div><div class="corners"></div><span class="frame-label"><span class="dot"></span><span class="txt">Cam C · 35mm</span></span></div>
      <div class="caption" id="caption" hidden></div>
      <div class="changed-chip" id="changed-chip">mudou → <b>nada ainda</b></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <section class="controls" id="controls"></section>
    <section class="codepanel" aria-label="Código da demonstração">
      <div class="codepanel-head"><span>Código · <b id="code-title">escolha um movimento</b></span><span>ao vivo</span></div>
      <pre id="code-body"></pre>
      <div class="readout" id="readout"></div>
      <div class="readout-extra" id="readout-extra" hidden></div>
    </section>
  </aside>
</div>
<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
